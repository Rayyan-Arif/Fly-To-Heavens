<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fly To Heavens | Login</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
    />
  </head>
  <body class="min-h-screen bg-gray-50 text-gray-900">
    <header class="border-b border-gray-200 bg-blue-900 text-white shadow-sm">
      <div class="mx-auto flex w-full max-w-6xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
        <h1 class="text-xl font-semibold tracking-tight sm:text-2xl">Fly To Heavens</h1>
        <p class="text-sm text-blue-200 sm:text-base">Welcome back, traveler</p>
      </div>
    </header>

    <main class="mx-auto flex w-full max-w-6xl items-center px-4 py-10 sm:px-6 lg:px-8 lg:py-16">
      <section class="grid w-full gap-8 lg:grid-cols-2 lg:gap-10">
        <div class="order-2 rounded-2xl border border-gray-200 bg-white p-6 shadow-sm sm:p-8 lg:order-1">
          <p class="mb-2 text-xs font-semibold uppercase tracking-widest text-blue-500">Secure Access</p>
          <h2 class="mb-4 text-2xl font-bold text-gray-900 sm:text-3xl">Login to continue</h2>
          <p class="text-base leading-relaxed text-gray-500">
            Access your booking dashboard, reservations, and travel details in one place.
          </p>
        </div>

        <div class="order-1 lg:order-2 rounded-2xl border border-gray-200 bg-white p-5 shadow-sm sm:p-7">
          <form action="#" method="post" class="space-y-4">
            <h3 class="text-xl font-bold text-gray-900">Login to your account</h3>

            <div>
              <label for="login-email" class="mb-1 block text-sm font-medium text-gray-700">Email</label>
              <input
                id="login-email"
                name="email"
                type="email"
                required
                class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100"
                placeholder="you@example.com"
              />
            </div>

            <div>
              <label for="login-password" class="mb-1 block text-sm font-medium text-gray-700">Password</label>
              <input
                id="login-password"
                name="password"
                type="password"
                required
                class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100"
                placeholder="Enter password"
              />
            </div>

            <button
              type="submit"
              class="w-full rounded-lg bg-blue-600 px-4 py-3 text-sm font-semibold text-white transition-colors duration-300 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-200"
            >
              Login to Dashboard
            </button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
