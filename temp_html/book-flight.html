<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fly To Heavens | Book Flight</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
    />
  </head>
  <body class="min-h-screen bg-gray-50 text-gray-900">
    <header class="border-b border-gray-200 bg-blue-900 text-white shadow-sm">
      <div
        class="mx-auto flex w-full max-w-6xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8"
      >
        <h1 class="text-xl font-semibold tracking-tight sm:text-2xl">
          Fly To Heavens
        </h1>
        <p class="text-sm text-blue-200 sm:text-base">Booking page</p>
      </div>
    </header>

    <main class="mx-auto w-full max-w-4xl px-4 py-10 sm:px-6 lg:px-8 lg:py-16">
      <section class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm sm:p-8">
        <p class="mb-2 text-xs font-semibold uppercase tracking-widest text-blue-500">
          Next Step
        </p>
        <h2 class="text-2xl font-bold text-gray-900 sm:text-3xl">
          Booking page placeholder
        </h2>
        <p class="mt-3 text-base leading-relaxed text-gray-600">
          This page is linked from the individual flight page via the
          <span class="font-semibold text-blue-900">Book this flight</span> action.
          You can replace this with your actual booking form/page later.
        </p>
        <div class="mt-6">
          <a
            href="./flight.html"
            class="inline-flex min-h-[48px] items-center justify-center rounded-lg bg-[#1E3A8A] px-6 py-3 text-base font-semibold text-white transition-colors hover:bg-[#172554] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#3B82F6]"
          >
            Back to flight details
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
