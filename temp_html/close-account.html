<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fly To Heavens | Close account</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
    />
  </head>
  <body class="antialiased">
    <!-- Overlay -->
    <div
      class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 p-4"
      role="presentation"
    >
      <!-- Compact form card -->
      <div
        class="w-full max-w-sm rounded-xl border border-gray-200 bg-white p-6 shadow-2xl sm:p-7"
        role="dialog"
        aria-labelledby="close-account-title"
        aria-describedby="close-account-warning"
      >
        <h1 id="close-account-title" class="text-lg font-bold text-gray-900">
          Close account
        </h1>

        <p
          id="close-account-warning"
          class="mt-3 text-sm leading-relaxed text-gray-600"
        >
          This action cannot be undone, please enter your password to confirm.
        </p>

        <form action="#" method="post" class="mt-5 space-y-4">
          <div>
            <label for="close-password" class="mb-1 block text-sm font-medium text-gray-700"
              >Password</label
            >
            <input
              id="close-password"
              name="password"
              type="password"
              required
              autocomplete="current-password"
              class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100"
              placeholder="Your password"
            />
          </div>

          <button
            type="submit"
            class="w-full rounded-lg bg-red-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-200"
          >
            Confirm
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
