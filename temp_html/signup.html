<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fly To Heavens | Signup</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
    />
  </head>
  <body class="min-h-screen bg-gray-50 text-gray-900">
    <header class="border-b border-gray-200 bg-blue-900 text-white shadow-sm">
      <div class="mx-auto flex w-full max-w-6xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
        <h1 class="text-xl font-semibold tracking-tight sm:text-2xl">Fly To Heavens</h1>
        <p class="text-sm text-blue-200 sm:text-base">Create your traveler account</p>
      </div>
    </header>

    <main class="mx-auto flex w-full max-w-6xl items-center px-4 py-10 sm:px-6 lg:px-8 lg:py-16">
      <section class="grid w-full gap-8 lg:grid-cols-2 lg:gap-10">
        <div class="order-2 rounded-2xl border border-gray-200 bg-white p-6 shadow-sm sm:p-8 lg:order-1">
          <p class="mb-2 text-xs font-semibold uppercase tracking-widest text-blue-500">Get Started</p>
          <h2 class="mb-4 text-2xl font-bold text-gray-900 sm:text-3xl">Signup and start booking</h2>
          <p class="text-base leading-relaxed text-gray-500">
            Create your account to search flights, reserve seats, and manage trips easily.
          </p>
        </div>

        <div class="order-1 lg:order-2 rounded-2xl border border-gray-200 bg-white p-5 shadow-sm sm:p-7">
          <form action="#" method="post" class="space-y-4">
            <h3 class="text-xl font-bold text-gray-900">Create your account</h3>

            <div>
              <label for="signup-name" class="mb-1 block text-sm font-medium text-gray-700">Name</label>
              <input
                id="signup-name"
                name="name"
                type="text"
                required
                class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100"
                placeholder="Your full name"
              />
            </div>

            <div>
              <label for="signup-email" class="mb-1 block text-sm font-medium text-gray-700">Email</label>
              <input
                id="signup-email"
                name="email"
                type="email"
                required
                class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100"
                placeholder="you@example.com"
              />
            </div>

            <div>
              <label for="signup-password" class="mb-1 block text-sm font-medium text-gray-700">Password</label>
              <input
                id="signup-password"
                name="password"
                type="password"
                required
                class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100"
                placeholder="Create password"
              />
            </div>

            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
              <div>
                <label for="signup-age" class="mb-1 block text-sm font-medium text-gray-700">Age</label>
                <input
                  id="signup-age"
                  name="age"
                  type="number"
                  min="1"
                  required
                  class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100"
                  placeholder="Age"
                />
              </div>
              <div>
                <label for="signup-password-confirm" class="mb-1 block text-sm font-medium text-gray-700">
                  Password Confirm
                </label>
                <input
                  id="signup-password-confirm"
                  name="passwordConfirm"
                  type="password"
                  required
                  class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100"
                  placeholder="Repeat password"
                />
              </div>
            </div>

            <div>
              <label for="signup-address" class="mb-1 block text-sm font-medium text-gray-700">Address</label>
              <input
                id="signup-address"
                name="address"
                type="text"
                required
                class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100"
                placeholder="Street, City, Country"
              />
            </div>

            <button
              type="submit"
              class="w-full rounded-lg border border-blue-900 bg-blue-900 px-4 py-3 text-sm font-semibold text-white transition-colors duration-300 hover:bg-blue-950 focus:outline-none focus:ring-2 focus:ring-blue-200"
            >
              Create New Account
            </button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
